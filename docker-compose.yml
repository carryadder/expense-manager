services:
  web:
    build: .
    image: splitly
    ports:
      - "8007:8007"
    environment:
      # Generate your own for production:  python -c "import secrets;print(secrets.token_urlsafe(50))"
      SECRET_KEY: "change-me-in-production"
      DEBUG: "false"
      # List the host(s)/IP you serve on. CSRF_TRUSTED_ORIGINS is auto-derived
      # from these, so a bare IP over HTTP won't 403 on login POST.
      ALLOWED_HOSTS: "72.60.204.176,localhost,127.0.0.1"
      # Set explicitly if you front the app with a domain / HTTPS, e.g.:
      # CSRF_TRUSTED_ORIGINS: "https://splitly.example.com"
      SQLITE_PATH: "/data/db.sqlite3"
      PORT: "8007"
    volumes:
      - splitly-data:/data
    restart: unless-stopped

volumes:
  splitly-data:
